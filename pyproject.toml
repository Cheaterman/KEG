[project]
name = 'keg-engine'
description = 'KEG is an Engine for Games'
readme = 'README.md'
version = '0.1'
requires-python = '>= 3.12'
authors = [
    {name='Guillaume BRUN', email='the.cheaterman@gmail.com'}
]
license = 'MIT'
license-files = ['LICENSE']

[project.optional-dependencies]
examples = ['Kivy']

[build-system]
requires = ['setuptools >= 77.0.3']
build-backend = 'setuptools.build_meta'

[tool.mypy]
python_version = '3.12'
strict = true
files = ['keg', 'tests']

[tool.pytest.ini_options]
norecursedirs = ['.*', 'env']
addopts = [
    '-Werror',
    '--cov=keg',
    '--cov-fail-under=100',
    '--cov-report=term-missing:skip-covered',
    '--color=yes',
]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = 'py312'
line-length = 79

[tool.ruff.lint]
extend-select = ['E', 'W', 'C']
preview = true

[tool.setuptools.package-data]
keg = ['py.typed', '*.pyi']
